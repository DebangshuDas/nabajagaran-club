spring:
  application:
    name: nabajaran-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nabajaran_db}
    username: ${SPRING_DATASOURCE_USERNAME:nabajaran_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    baseline-version: "0"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin01}
  gallery:
    storage:
      enabled: ${GALLERY_STORAGE_ENABLED:false}
      endpoint: ${GALLERY_R2_ENDPOINT:}
      region: ${GALLERY_R2_REGION:auto}
      access-key-id: ${GALLERY_R2_ACCESS_KEY_ID:}
      secret-access-key: ${GALLERY_R2_SECRET_ACCESS_KEY:}
      bucket: ${GALLERY_R2_BUCKET:}
      public-base-url: ${GALLERY_R2_PUBLIC_BASE_URL:}

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# Temporary startup diagnostics
debug: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.beans.factory: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.hibernate: INFO
    org.hibernate.tool.schema: DEBUG
    com.zaxxer.hikari: DEBUG