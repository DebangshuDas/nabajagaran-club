spring:
  application:
    name: nabajaran-api

  flyway:
    baseline-on-migrate: true
    baseline-version: "0"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://nabajagaran-club.debangshudas2001.workers.dev}

server:
  port: ${PORT:10000}